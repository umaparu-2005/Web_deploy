<!DOCTYPE html>
<html class="has-effects" lang="en">
<head>
    <meta charset="UTF-8">
    <title>Cart | InstruHaven</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- Bootstrap & Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    
    <!-- Effects CSS -->
    <link rel="stylesheet" href="effects.css">
    
    <style>
        * { font-family: 'Poppins', sans-serif; }
        body {
            background: linear-gradient(135deg, #2b0a3d, #0f172a);
            color: #fff;
            padding-top: 110px; /* Navbar + icon bar space */
        }
        
        /* Navbar & Icon Bar */
        .navbar { backdrop-filter: blur(10px); background: rgba(0,0,0,0.4); }
        .icon-bar {
            background: rgba(0,0,0,0.35);
            padding: 8px 0;
            position: sticky;
            top: 56px;
            z-index: 900;
        }
        .icon-bar .icon-btn {
            color: #fff;
            text-decoration: none;
            margin: 0 15px;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 0.95rem;
        }
        .icon-bar .icon-btn i { font-size: 1.2rem; }
        
        /* Counter Badges */
        .cart-badge, .wishlist-badge {
            background: #ff0080;
            color: white;
            border-radius: 50%;
            width: 24px; height: 24px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 0.8rem;
            font-weight: bold;
            margin-left: 5px;
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0%,100% { transform: scale(1); }
            50% { transform: scale(1.2); }
        }
        
        /* Cart Styles */
        .cart-container {
            max-width: 1000px;
            margin: 40px auto;
            background: rgba(255,255,255,0.06);
            padding: 30px;
            border-radius: 20px;
            backdrop-filter: blur(15px);
        }
        .cart-item {
            display: flex;
            align-items: center;
            gap: 20px;
            padding: 20px;
            background: rgba(255,255,255,0.05);
            border-radius: 15px;
            margin-bottom: 15px;
            transition: all 0.3s;
        }
        .cart-item:hover { transform: translateX(5px); box-shadow: 0 10px 30px rgba(0,0,0,0.3); }
        .cart-item img { width: 80px; height: 80px; object-fit: cover; border-radius: 10px; }
        .cart-item-info h5 { margin: 0 0 5px 0; }
        .cart-item-info p { margin: 0; opacity: 0.8; }
        .quantity-controls { display: flex; align-items: center; gap: 10px; }
        .qty-btn { 
            width: 35px; height: 35px; 
            background: rgba(255,255,255,0.2); 
            border: none; border-radius: 50%; 
            color: white; font-weight: bold; 
            cursor: pointer;
        }
        .qty-btn:hover { background: #ff0080; }
        .remove-btn {
            background: #ef4444;
            border: none;
            color: white;
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 500;
        }
        .remove-btn:hover { background: #dc2626; }
        
        .cart-footer {
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px solid rgba(255,255,255,0.2);
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 1.3rem;
            font-weight: bold;
        }
        .checkout-btn {
            background: linear-gradient(45deg, #ff0080, #00ccff);
            border: none;
            padding: 15px 30px;
            color: white;
            font-size: 1.1rem;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 10px 30px rgba(255,0,128,0.4);
            transition: all 0.3s;
        }
        .checkout-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 15px 40px rgba(0,204,255,0.6);
        }
        .empty { text-align: center; padding: 60px 20px; opacity: 0.6; }
    </style>
</head>

<body>
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark fixed-top">
        <div class="container">
            <a class="navbar-brand fw-bold" href="index.html">
                <img src="logos.jpeg" alt="Logo" style="height:30px; width:auto;" class="me-2;">
                InstruHaven
            </a>
            <button class="navbar-toggler" data-bs-toggle="collapse" data-bs-target="#navMenu">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navMenu">
                <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link" href="#home">Home</a></li>
          <li class="nav-item"><a class="nav-link" href="#about">About</a></li>
          <li class="nav-item"><a class="nav-link" href="#categories">Categories</a></li>
          <li class="nav-item"><a class="nav-link" href="#products">Shop</a></li>
          <li class="nav-item"><a class="nav-link" href="#top-brands">Top Brands</a></li>
          <li class="nav-item"><a class="nav-link" href="#why-us">Why Choose Us</a></li>
          <li class="nav-item"><a class="nav-link" href="review.html">Reviews</a></li>
          <li class="nav-item"><a class="nav-link" href="login.html">LOGIN</a></li>
        </ul>
            </div>
        </div>
    </nav>

    <!-- Icon Bar with LIVE COUNTERS -->
    <div class="icon-bar text-center">
        <a href="full.html" class="icon-btn"><i class="bi bi-house-fill"></i><span>Home</span></a>
        <a href="cart.html" class="icon-btn" id="cartLink">
            <i class="bi bi-bag-fill"></i><span>Cart</span><span class="cart-badge" id="cartCount">0</span>
        </a>
        <a href="wishlist.html" class="icon-btn" id="wishlistLink">
            <i class="bi bi-heart-fill"></i><span>Wishlist</span><span class="wishlist-badge" id="wishlistCount">0</span>
        </a>
    </div>

    <!-- Effects Layer -->
    <div class="effects-layer">
        <div class="stars"></div>
        <div class="logo-glow"></div>
        <div class="music-waves">
            <span></span><span></span><span></span><span></span>
            <span></span><span></span><span></span><span></span>
            <span></span><span></span><span></span>
        </div>
        <div class="floating-particles">
            <div class="particle"></div>
            <div class="particle"></div>
            <div class="particle"></div>
        </div>
    </div>

    <!-- Cart Content -->
    <div class="cart-container" id="cartContainer">
        <h2 class="text-center mb-4">🛒 Your Cart</h2>
        <div id="cartItems"></div>
        <div class="cart-footer" id="cartFooter" style="display: none;">
            <span>Total: <span id="totalAmount">₹0</span></span>
            <button class="checkout-btn" onclick="goToCheckout()">Proceed to Checkout</button>
        </div>
        <div class="empty" id="emptyCart" style="display: none;">
            <i class="bi bi-cart-x" style="font-size: 4rem; opacity: 0.5;"></i>
            <h3>Your cart is empty</h3>
            <p>Start shopping to add items to your cart!</p>
            <a href="full.html" class="btn btn-outline-info btn-lg mt-3">Continue Shopping</a>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        let cart = JSON.parse(localStorage.getItem('cart')) || [];
        let wishlist = JSON.parse(localStorage.getItem('wishlist')) || [];

        function updateCounters() {
            document.getElementById('cartCount').textContent = cart.length;
            document.getElementById('wishlistCount').textContent = wishlist.length;
        }

        function loadCart() {
            const cartItems = document.getElementById('cartItems');
            const emptyCart = document.getElementById('emptyCart');
            const cartFooter = document.getElementById('cartFooter');
            
            if (cart.length === 0) {
                cartItems.style.display = 'none';
                emptyCart.style.display = 'block';
                cartFooter.style.display = 'none';
                return;
            }
            
            cartItems.style.display = 'block';
            emptyCart.style.display = 'none';
            cartFooter.style.display = 'flex';
            
            let total = 0;
            cartItems.innerHTML = cart.map((item, index) => {
                const priceNum = parseFloat(item.price.replace('₹', '').replace(',', ''));
                total += priceNum * item.quantity;
                
                return `
                    <div class="cart-item">
                        <img src="${item.image || 'https://via.placeholder.com/80?text=?'}">
                        <div class="cart-item-info flex-grow-1">
                            <h5>${item.name}</h5>
                            <p>${item.price}</p>
                        </div>
                        <div class="quantity-controls">
                            <button class="qty-btn" onclick="updateQuantity(${index}, -1)">-</button>
                            <span style="min-width: 30px; text-align: center;">${item.quantity}</span>
                            <button class="qty-btn" onclick="updateQuantity(${index}, 1)">+</button>
                        </div>
                        <div style="margin-left: 20px;">
                            <p style="font-size: 1.1rem; font-weight: bold; margin: 0;">₹${(priceNum * item.quantity).toLocaleString()}</p>
                            <button class="remove-btn mt-2" onclick="removeFromCart(${index})">Remove</button>
                        </div>
                    </div>
                `;
            }).join('');
            
            document.getElementById('totalAmount').textContent = `₹${total.toLocaleString()}`;
            updateCounters();
        }

        function updateQuantity(index, change) {
            cart[index].quantity += change;
            if (cart[index].quantity <= 0) {
                cart.splice(index, 1);
            }
            localStorage.setItem('cart', JSON.stringify(cart));
            loadCart();
        }

        function removeFromCart(index) {
            cart.splice(index, 1);
            localStorage.setItem('cart', JSON.stringify(cart));
            loadCart();
        }

        function goToCheckout() {
            if (cart.length === 0) return;
            localStorage.setItem('checkoutCart', JSON.stringify(cart));
            window.location.href = 'payment.html';
        }

        // Initialize
        document.addEventListener('DOMContentLoaded', loadCart);
        window.addEventListener('storage', loadCart);
    </script>
</body>
</html>
