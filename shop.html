<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shop - Musical Haven</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        *{margin:0;padding:0;box-sizing:border-box;}
        body{font-family:'Poppins',sans-serif;background:linear-gradient(135deg,#0c0c0c 0%,#1a1a2e 50%,#193277 100%);color:#fff;overflow-x:hidden;}
        
        /* Header */
        header{position:fixed;top:0;width:100%;background:rgba(12,12,12,0.95);backdrop-filter:blur(20px);z-index:1000;padding:1rem 0;}
        nav{max-width:1400px;margin:0 auto;display:flex;justify-content:space-between;align-items:center;padding:0 5%;}
        .logo{font-size:2rem;font-weight:700;background:linear-gradient(45deg,#539fe7,#420362,#1d0b90);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
        .search-container{position:relative;flex:1;max-width:500px;margin:0 2rem;}
        .search-box{width:100%;padding:1rem 1.5rem;border:none;border-radius:50px;background:rgba(255,255,255,0.1);backdrop-filter:blur(10px);color:#fff;}
        .search-btn{position:absolute;right:1rem;top:50%;transform:translateY(-50%);background:none;border:none;color:#3f6cf3;font-size:1.2rem;cursor:pointer;}
        .header-icons{display:flex;gap:2rem;align-items:center;}
        .icon-btn{background:rgba(255,255,255,0.1);border:2px solid rgba(255,255,255,0.2);width:50px;height:50px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;cursor:pointer;transition:all .3s;}
        .icon-btn:hover{background:linear-gradient(45deg,#5c0101,#a269eb);transform:scale(1.1);}
        .cart-count,.wishlist-count{position:absolute;top:-5px;right:-5px;background:#320a55;color:white;border-radius:50%;width:20px;height:20px;font-size:0.7rem;display:flex;align-items:center;justify-content:center;}
        
        /* Shop */
        .shop-filters{padding:140px 5% 40px;background:rgba(255,255,255,0.02);}
        .shop-header{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:1rem;margin-bottom:2rem;}
        .cta-btn{padding:1rem 2rem;background:linear-gradient(45deg,#cc98eb,#7391f6);color:white;text-decoration:none;border-radius:50px;font-weight:600;transition:all .3s;}
        .cta-btn:hover{transform:translateY(-2px);box-shadow:0 10px 20px rgba(204,152,235,0.4);}
        .filters-container{background:rgba(255,255,255,0.05);padding:2rem;border-radius:20px;backdrop-filter:blur(20px);margin-bottom:3rem;}
        .filter-group{display:flex;gap:1rem;flex-wrap:wrap;align-items:center;justify-content:center;}
        .filter-select{padding:0.8rem 1.5rem;background:rgba(255,255,255,0.1);border:1px solid rgba(255,255,255,0.2);border-radius:25px;color:#fff;font-family:inherit;}
        .filter-btn,.clear-btn{padding:0.8rem 2rem;border-radius:25px;cursor:pointer;font-weight:600;}
        .filter-btn{background:linear-gradient(45deg,#cc98eb,#7391f6);color:white;border:none;}
        .clear-btn{background:rgba(255,255,255,0.1);color:white;border:1px solid rgba(255,255,255,0.2);}
        .shop-products{padding:0 5% 100px;}
        .products-stats{display:flex;justify-content:space-between;align-items:center;margin-bottom:2rem;flex-wrap:wrap;gap:1rem;}
        .products-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:2rem;}
        .product-card{background:rgba(255,255,255,0.05);backdrop-filter:blur(20px);border-radius:20px;overflow:hidden;transition:all .4s;border:1px solid rgba(255,255,255,0.1);cursor:pointer;}
        .product-card:hover{transform:translateY(-15px);box-shadow:0 30px 60px rgba(0,0,0,0.5);}
        .product-image-container{position:relative;height:280px;overflow:hidden;}
        .product-img{width:100%;height:100%;object-fit:cover;}
        .product-icon-fallback{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);background:rgba(255,255,255,0.1);padding:2rem;border-radius:20px;display:flex;align-items:center;justify-content:center;}
        .quick-actions{position:absolute;top:1rem;right:1rem;display:flex;flex-direction:column;gap:0.5rem;opacity:0;transition:all .3s;}
        .product-card:hover .quick-actions{opacity:1;}
        .quick-cart,.quick-wishlist{width:40px;height:40px;border-radius:50%;border:none;background:rgba(255,255,255,0.2);color:white;cursor:pointer;transition:all .3s;}
        .quick-cart:hover{background:#28a745;transform:scale(1.1);}
        .quick-wishlist:hover{background:#ff69b4;transform:scale(1.1);}
        .product-info{padding:1.5rem;}
        .product-brand-badge{background:linear-gradient(45deg,#7391f6,#cc98eb);color:white;padding:0.3rem 1rem;border-radius:20px;font-size:0.8rem;font-weight:600;display:inline-block;margin-bottom:0.5rem;}
        .product-title{font-size:1.2rem;margin-bottom:0.5rem;color:#fff;font-weight:600;}
        .product-price{font-size:1.6rem;font-weight:700;color:#1f44b6;margin-bottom:0.5rem;}
        .product-rating{color:#f4dc55;font-size:1.1rem;}
        .no-products{text-align:center;padding:4rem;}
        footer{background:rgba(12,12,12,0.9);padding:2rem 5%;text-align:center;}
        .social-links{display:flex;justify-content:center;gap:2rem;margin-bottom:1rem;}
        .social-link{width:50px;height:50px;background:linear-gradient(45deg,#642323,#592082);border-radius:50%;display:flex;align-items:center;justify-content:center;color:#cfcece;text-decoration:none;font-size:1.3rem;}
        @media (max-width:768px){.filter-group{flex-direction:column;}.products-grid{grid-template-columns:1fr;}}
    </style>
</head>
<body>
    <!-- Header -->
    <header>
        <nav>
            <div class="logo">Musical Haven</div>
            <div class="search-container">
                <input type="text" class="search-box" placeholder="Search Yamaha, Roland..." id="searchInput">
                <button class="search-btn" onclick="filterProducts()">🔍</button>
            </div>
            <div class="header-icons">
                <div class="icon-btn" onclick="window.location.href='wishlist.html'">
                    ❤️<span id="wishlistCount">0</span>
                </div>
                <div class="icon-btn" onclick="window.location.href='cart.html'">
                    🛒<span id="cartCount">0</span>
                </div>
                <a href="login.html" class="icon-btn">👤</a>
            </div>
        </nav>
    </header>

    <!-- Filters -->
    <section class="shop-filters">
        <div class="shop-header">
            <h1 id="shopTitle">All Products</h1>
            <a href="full.html" class="cta-btn">← Home</a>
        </div>
        <div class="filters-container">
            <div class="filter-group">
                <select id="categoryFilter" onchange="filterProducts()">
                    <option value="">All Categories</option>
                    <option value="guitars">Guitars</option>
                    <option value="keyboards">Keyboards</option>
                    <option value="drums">Drums</option>
                    <option value="classical">Saxophones</option>
                    <option value="classical">Pianos</option>
                </select>
                <select id="brandFilter" onchange="filterProducts()">
                    <option value="">All Brands</option>
                    <option value="Yamaha">Yamaha</option>
                    <option value="Roland">Roland</option>
                    <option value="Tama">Tama</option>
                    <option value="Alesis">Alesis</option>
                    <option value="Cort">Cort</option>
                    <option value="Vault">Vault</option>
                </select>
                <button class="filter-btn" onclick="filterProducts()">Filter</button>
                <button class="clear-btn" onclick="clearFilters()">Clear</button>
            </div>
        </div>
    </section>

    <!-- Products -->
    <section class="shop-products">
        <div class="products-stats">
            <span id="productsCount">Loading...</span>
            <div>
                <label>Sort: </label>
                <select id="sortSelect" onchange="filterProducts()">
                    <option value="name">A-Z</option>
                    <option value="price-low">Price Low</option>
                    <option value="price-high">Price High</option>
                    <option value="rating">Rating</option>
                </select>
            </div>
        </div>
        <div class="products-grid" id="productsGrid"></div>
        <div id="noProducts" class="no-products" style="display:none;">
            <i class="fas fa-search" style="font-size:4rem;color:rgba(255,255,255,0.3);"></i>
            <h3>No Products Found</h3>
            <p>Try different filters</p>
            <a href="shop.html" class="cta-btn">Show All Products</a>
        </div>
    </section>

    <!-- Footer -->
    <footer>
        <div class="social-links">
            <a href="https://wa.me/916385250077" class="social-link"><i class="fab fa-whatsapp"></i></a>
            <a href="tel:+916385250077" class="social-link"><i class="fas fa-phone"></i></a>
            <a href="mailto:support@musicalhaven.com" class="social-link"><i class="fas fa-envelope"></i></a>
        </div>
        <p style="opacity:0.7;">Musical Haven © 2025 | +91 6385250077</p>
    </footer>

    <script>
        // COMPLETE WORKING PRODUCTS DATA
        const allProducts = [
            {name:"Yamaha FG800",price:"$349",rating:4.8,icon:"fas fa-guitar",brand:"Yamaha",category:"guitars"},
            {name:"Cort G250",price:"$299",rating:4.6,icon:"fas fa-guitar",brand:"Cort",category:"guitars"},
            {name:"Fender Stratocaster",price:"$1299",rating:5.0,icon:"fas fa-guitar",brand:"Fender",category:"guitars"},
            {name:"Gibson Les Paul",price:"$2499",rating:5.0,icon:"fas fa-guitar",brand:"Gibson",category:"guitars"},
            {name:"Yamaha P-125",price:"$899",rating:4.8,icon:"fas fa-piano-keyboard",brand:"Yamaha",category:"keyboards"},
            {name:"Roland FP-30X",price:"$999",rating:4.9,icon:"fas fa-piano-keyboard",brand:"Roland",category:"keyboards"},
            {name:"Casio PX-S1100",price:"$749",rating:4.7,icon:"fas fa-piano-keyboard",brand:"Casio",category:"keyboards"},
            {name:"Roland TD-17",price:"$1799",rating:4.8,icon:"fas fa-drum",brand:"Roland",category:"drums"},
            {name:"Tama Imperialstar",price:"$1199",rating:4.7,icon:"fas fa-drum",brand:"Tama",category:"drums"},
            {name:"Alesis Nitro Max",price:"$649",rating:4.5,icon:"fas fa-drum",brand:"Alesis",category:"drums"},
            {name:"Yamaha V3 Violin",price:"$399",rating:4.8,icon:"fas fa-music",brand:"Yamaha",category:"classical"},
            {name:"Vault VN51 Violin",price:"$299",rating:4.6,icon:"fas fa-music",brand:"Vault",category:"classical"}
        ];

        let cart = JSON.parse(localStorage.getItem('cart')) || [];
        let filteredProducts = [...allProducts];

        // Initialize
       document.addEventListener('DOMContentLoaded', function() {
    updateWishlistCount();
    document.getElementById('cartCount').textContent = cart.length;
    displayProducts(allProducts);
});

        function createProductCard(product) {
            const stars = '★'.repeat(Math.floor(product.rating));
            return `
                <div class="product-card" onclick="window.location.href='product.html?id=${encodeURIComponent(product.name)}'">
                    <div class="product-image-container">
                        <div class="product-icon-fallback">
                            <i class="${product.icon}" style="font-size:3rem;color:#4ecdc4;"></i>
                        </div>
                        <div class="quick-actions">
                            <button class="quick-cart" onclick="event.stopPropagation();addToCart('${product.name}')">
                                🛒
                            </button>
                            <button class="quick-wishlist" onclick="event.stopPropagation();addToWishlist('${product.name}')">
                                ❤️
                            </button>
                        </div>
                    </div>
                    <div class="product-info">
                        <div class="product-brand-badge">${product.brand}</div>
                        <h3 class="product-title">${product.name}</h3>
                        <div class="product-price">${product.price}</div>
                        <div class="product-rating">${stars} (${product.rating})</div>
                    </div>
                </div>`;
        }

        function displayProducts(productsList) {
            const grid = document.getElementById('productsGrid');
            const count = document.getElementById('productsCount');
            const noProducts = document.getElementById('noProducts');
            
            if (productsList.length === 0) {
                grid.innerHTML = '';
                noProducts.style.display = 'block';
                count.textContent = '0 Products';
                return;
            }
            
            noProducts.style.display = 'none';
            grid.innerHTML = productsList.map(createProductCard).join('');
            count.textContent = `${productsList.length} Products`;
        }

        function filterProducts() {
            let results = [...allProducts];
            
            const category = document.getElementById('categoryFilter').value;
            const brand = document.getElementById('brandFilter').value;
            const sort = document.getElementById('sortSelect').value;
            const search = document.getElementById('searchInput').value.toLowerCase();
            
            if (search) {
                results = results.filter(p => 
                    p.name.toLowerCase().includes(search) || 
                    p.brand.toLowerCase().includes(search)
                );
            }
            
            if (category) {
                results = results.filter(p => p.category === category);
            }
            
            if (brand) {
                results = results.filter(p => p.brand === brand);
            }
            
            // Sort
            if (sort === 'price-low') {
                results.sort((a,b) => parseFloat(a.price.replace('$','')) - parseFloat(b.price.replace('$','')));
            } else if (sort === 'price-high') {
                results.sort((a,b) => parseFloat(b.price.replace('$','')) - parseFloat(a.price.replace('$','')));
            } else if (sort === 'rating') {
                results.sort((a,b) => b.rating - a.rating);
            } else {
                results.sort((a,b) => a.name.localeCompare(b.name));
            }
            
            displayProducts(results);
        }

        function updateCounters() {
    const cartCount = document.getElementById('cartCount');
    const wishlistCount = document.getElementById('wishlistCount');
    
    if (cartCount) {
        const cart = JSON.parse(localStorage.getItem('cart')) || [];
        cartCount.textContent = cart.reduce((sum, item) => sum + item.quantity, 0);
    }
    
    if (wishlistCount) {
        const wishlist = JSON.parse(localStorage.getItem('wishlist')) || [];
        wishlistCount.textContent = wishlist.length;
    }
}

// Call on load and storage change
document.addEventListener('DOMContentLoaded', updateCounters);
window.addEventListener('storage', updateCounters);


        function clearFilters() {
            document.getElementById('categoryFilter').value = '';
            document.getElementById('brandFilter').value = '';
            document.getElementById('sortSelect').value = 'name';
            document.getElementById('searchInput').value = '';
            displayProducts(allProducts);
        }

        function addToCart(productName) {  
    const product = allProducts.find(p => p.name === productName);
    const cartItem = { name: product.name, price: product.price, image: product.icon, quantity: 1 };
    
    const existing = cart.find(item => item.name === product.name);
    if (existing) {
        existing.quantity++;
    } else {
        cart.push(cartItem);
    }
    
    localStorage.setItem('cart', JSON.stringify(cart));  
    document.getElementById('cartCount').textContent = cart.reduce((sum, item) => sum + item.quantity, 0);
    showNotification(`${product.name} added to cart! 🛒`);  
}


        function showNotification(message) {
            const notification = document.createElement('div');
            notification.style.cssText = `
                position:fixed;top:120px;right:20px;background:linear-gradient(45deg,#28a745,#20c997);
                color:white;padding:1rem 2rem;border-radius:50px;z-index:10000;box-shadow:0 10px 30px rgba(0,0,0,0.3);
                font-weight:600;animation:slideIn 0.3s ease;
            `;
            notification.textContent = message;
            document.body.appendChild(notification);
            setTimeout(() => notification.remove(), 3000);
        }

        let wishlist = JSON.parse(localStorage.getItem('wishlist')) || [];

function addToWishlist(productName) {
    const product = allProducts.find(p => p.name === productName);
    if (!product) return;

    const exists = wishlist.find(item => item.name === product.name);  
    if (exists) {  
        showNotification("❤️ Already in wishlist");  
        return;  
    }  

    wishlist.push({  
        name: product.name,  
        price: product.price,  
        image: `https://via.placeholder.com/100x100/4ecdc4/fff?text=${encodeURIComponent(product.name.substring(0,3))}` // Better placeholder
    });  

    localStorage.setItem('wishlist', JSON.stringify(wishlist));  
    updateWishlistCount();  
    showNotification("❤️ Added to wishlist");
}

function updateWishlistCount() {
    const countEl = document.getElementById("wishlistCount");
    if (countEl) countEl.textContent = wishlist.length;
}
    </script>
</body>
</html>
