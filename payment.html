<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Payment | Musical Haven</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">

  <style>
    *{ font-family: 'Poppins', sans-serif; }

    body{
      background: radial-gradient(circle at top, #e5acff8e, #35240845);
      color:#000000;
      min-height:100vh;
      margin:0;
    }

    .payment-card{
      background: rgba(59, 58, 58, 0.08);
      border-radius:20px;
      border:1px solid rgb(21, 72, 154);
      grid-auto-flow: inherit;
      padding:24px;
      max-width:460px;
      width:100%;
    }

    h3{ font-size: 1.4rem; }

    .product-preview{
      background: rgba(0,0,0,0.35);
      border-radius:15px;
      padding:20px;
      text-align:center;
      margin-bottom:25px;
    }

    .product-preview img{
      max-width:90px;
      border-radius:12px;
      margin-bottom:10px;
    }

    .payment-method{
      background: rgba(255,255,255,0.04);
      border-radius:15px;
      border:2px solid rgba(0,204,255,0.3);
      padding:14px 16px;
      margin-bottom:10px;
      cursor:pointer;
      transition:0.25s;
    }

    .payment-method:hover,
    .payment-method.selected{
      border-color:#00ccff;
      background: rgba(0,204,255,0.12);
      transform: translateY(-2px);
    }

    .pay-btn{
      background: linear-gradient(45deg,#ee4198,#4bc9e9);
      border:none;
      border-radius:50px;
      padding:12px 32px;
      font-weight:600;
      width:100%;
    }

    .gpay-logo{
      height:28px;
      width:auto;
      margin-right:8px;
    }
  </style>
</head>

<body>

  <!-- top bar -->
  <nav class="navbar navbar-dark fixed-top" style="background:rgba(0,0,0,0.4); height:50px;">
    <div class="container-fluid px-3 d-flex justify-content-between align-items-center">
      <a href="full.html" class="navbar-brand fw-semibold" style="font-size:0.95rem;">
        Musical Haven
      </a>
      <a href="full.html#products" class="btn btn-outline-light btn-sm">Back to Shop</a>
    </div>
  </nav>

  <!-- center the card horizontally, with space under navbar -->
  <div class="container d-flex justify-content-center" style="padding-top:80px; padding-bottom:40px;">
    <div class="payment-card">
      <h3 class="text-center mb-3">Complete your payment</h3>

      <!-- product summary -->
      <div class="product-preview">
        <img id="checkoutImage" src="" alt="Product">
        <h5 id="checkoutName" class="mt-2 mb-1"></h5>
        <p id="checkoutPrice" class="fs-4 fw-bold mb-0"></p>
      </div>

      <div class="text-center">
        <h5 class="mb-3">Choose payment method</h5>
      </div>

      <div class="mx-auto" style="max-width:380px;">
        <!-- Google Pay -->
        <div class="payment-method" onclick="selectMethod(this,'gpay')">
          <div class="d-flex align-items-center">
            <img src="gpaylogo.png" alt="Google Pay" class="gpay-logo">
            <div>
              <strong>Google Pay (GPay)</strong><br>
              <small>Pay securely using your UPI ID / number</small>
            </div>
          </div>
        </div>

        <!-- Cash on Delivery -->
        <div class="payment-method" onclick="selectMethod(this,'cod')">
          <div class="d-flex align-items-center">
            <i class="bi bi-cash-coin fs-2 text-warning me-3"></i>
            <div>
              <strong>Cash on Delivery</strong><br>
              <small>Pay when the instrument is delivered</small>
            </div>
          </div>
        </div>
      </div>

      <!-- GPay number field (hidden until GPay is selected) -->
      <div id="gpaySection" class="mt-3" style="display:none;">
        <label for="gpayNumber" class="form-label">Enter your GPay / UPI number</label>
        <input type="text" id="gpayNumber" class="form-control" placeholder="eg: 9876543210 or name@upi">
      </div>

      <button class="btn btn-lg text-white mt-3 pay-btn" id="payBtn" onclick="processPayment()" disabled>
    <a href="order.html" onmouseover="hoverCard('Ordered')" onmouseout="unhoverCard()">    
    <span id="payText">Proceed to pay</span></a>
        <span class="spinner-border spinner-border-sm d-none" id="paySpinner"></span>
           </button>
    
    </div>
  </div>
 <script>
    
 function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.style.display = 'block';
  setTimeout(() => t.style.display = 'none', 30000); // or 10000+
}


  const checkoutProduct = JSON.parse(localStorage.getItem('checkoutProduct') || '{}');
  if (checkoutProduct.name) {
    document.getElementById('checkoutName').textContent  = checkoutProduct.name;
    document.getElementById('checkoutPrice').textContent = checkoutProduct.price;
    document.getElementById('checkoutImage').src         = checkoutProduct.image;
  } else {
    alert('No product selected. Redirecting back to shop.');
    window.location.href = 'full.html#products';
  }

  let selectedMethod = '';

  function selectMethod(el, method){
    document.querySelectorAll('.payment-method').forEach(m => m.classList.remove('selected'));
    el.classList.add('selected');
    selectedMethod = method;

    document.getElementById('gpaySection').style.display = (method === 'gpay') ? 'block' : 'none';
    document.getElementById('payBtn').disabled = false;
  }

  function processPayment(){
    if (!selectedMethod) return;

if (selectedMethod === 'gpay') {
  const num = document.getElementById('gpayNumber').value.trim();
  if (!num) {
    showToast('Please enter your GPay / UPI number.');
    return;
  }

  const payBtn  = document.getElementById('payBtn');
  const payText = document.getElementById('payText');
  const spinner = document.getElementById('paySpinner');

  payBtn.disabled = true;
  spinner.classList.remove('d-none');
  payText.textContent = 'Processing GPay payment...';

  // simulate processing
  setTimeout(() => {
    showToast('Order placed successfully for ' + checkoutProduct.name + '!');
    localStorage.removeItem('checkoutProduct');

    // redirect after 10 seconds
    setTimeout(() => {
      window.location.href = 'full.html#products';
    }, 10000);
  }, 2000);   // 2s processing time
}

    if (selectedMethod === 'gpay') {
      const num = document.getElementById('gpayNumber').value.trim();
      if (!num) {
        showToast('Please enter your GPay / UPI number.');
        return;
      }

      const payBtn  = document.getElementById('payBtn');
      const payText = document.getElementById('payText');
      const spinner = document.getElementById('paySpinner');

      payBtn.disabled = true;
      spinner.classList.remove('d-none');
      payText.textContent = 'Processing GPay payment...';

      setTimeout(() => {
  showToast('Order placed successfully for ' + checkoutProduct.name + '!');
  localStorage.removeItem('checkoutProduct');
  
}, 10000);   // 10 seconds


    }
  }
</script>

<div id="toast" style="
  position: fixed;
  right: 20px;
  bottom: 20px;
  background: #333;
  color: #fff;
  padding: 10px 16px;
  border-radius: 6px;
  font-size: 0.9rem;
  display: none;
  z-index: 9999;">
</div>

</body>
</html>
