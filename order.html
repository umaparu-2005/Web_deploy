<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Order Status | Musical Haven</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
  <style>
    body{
  font-family: 'Poppins', sans-serif;
  background: linear-gradient(135deg, #ecdac8, #ddeeed);
  min-height: 100vh;
  margin: 0;
  display: flex;
  align-items: center;
  justify-content: center;
}
    .order-card{
  background: rgba(255,255,255,0.95);
  border-radius: 20px;
  padding: 24px 32px;
  max-width: 480px;
  text-align: center;

  box-shadow:
    0 0 15px rgba(173, 73, 255, 0.6),
    0 0 30px rgba(173, 73, 255, 0.4),
    0 0 60px rgba(173, 73, 255, 0.2);

  animation: fadeSlideUp 1s ease forwards;
    }

.order-card:hover{
  transform: scale(1.02);
  box-shadow:
    0 0 25px rgba(173, 73, 255, 0.8),
    0 0 50px rgba(173, 73, 255, 0.5),
    0 0 80px rgba(173, 73, 255, 0.3);
}

@keyframes glow {
  0% {
    box-shadow:
      0 0 10px rgba(173, 73, 255, 0.4),
      0 0 30px rgba(173, 73, 255, 0.2);
  }
  50% {
    box-shadow:
      0 0 30px rgba(89, 0, 161, 0.8),
      0 0 60px rgba(173, 73, 255, 0.4);
  }
  100% {
    box-shadow:
      0 0 10px rgba(173, 73, 255, 0.4),
      0 0 30px rgba(83, 32, 124, 0.2);
  }
}



.order-card{
  animation: glow 5.0s infinite ease-in-out;
}

    .order-title{
      font-size: 1.6rem;
      font-weight: 700;
      margin-bottom: 8px;
    }
    .order-sub{
      font-size: 1rem;
      margin-bottom: 16px;
    }

    @keyframes glow {
  0% {
    box-shadow:
      0 0 10px rgba(173, 73, 255, 0.4),
      0 0 30px rgba(173, 73, 255, 0.2);
  }
  50% {
    box-shadow:
      0 0 30px rgba(173, 73, 255, 0.8),
      0 0 60px rgba(173, 73, 255, 0.4);
  }
  100% {
    box-shadow:
      0 0 10px rgba(173, 73, 255, 0.4),
      0 0 30px rgba(173, 73, 255, 0.2);
  }
}

.order-card{
  animation: glow 2.5s infinite ease-in-out;
}
  </style>
</head>
<body>
  <div class="order-card">
    <div class="order-title">ORDER PLACED SUCCESSFULLY!!</div>
    <p class="order-sub">Your order will be delivered within 5 days.</p>
    <p>If you have any queries, Contact <strong>6385250077</strong>.</p>
    <a href="full.html#products" class="btn btn-primary mt-3">Back to shop</a>
  </div>
</body>
</html>
